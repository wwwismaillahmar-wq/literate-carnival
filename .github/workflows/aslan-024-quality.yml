name: ASLAN 024 quality gate
on:
  push:
    branches: [feat/aslan-web-exec-2026-024]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify six locale navigation dictionaries
        run: node scripts/check-six-locales.cjs
      - name: Academy unit tests
        run: npm run test:academy
      - name: Contabo TUS gateway isolated acceptance (24 MiB, auth, restart, SHA-256)
        run: node --test tests/uploads/contabo-gateway.test.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://zyenfobyorjfwkdgeube.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-build-only-not-a-valid-key' }}
        run: npm run build
