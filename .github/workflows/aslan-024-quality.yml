name: ASLAN 024 quality gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify six locale navigation dictionaries
        run: node scripts/check-six-locales.cjs
      - name: Academy unit tests
        run: npm run test:academy
      - name: Production build
        run: npm run build
