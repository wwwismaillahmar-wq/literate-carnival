name: ASLAN Development Quality
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: aslan-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
      - name: TypeScript
        run: npm run typecheck
      - name: Academy unit tests
        run: npm run test:academy
  operations-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate operating charter
        run: |
          test -s docs/operations/TEAM.md
          test -s docs/operations/MIGRATION-GATES.md
