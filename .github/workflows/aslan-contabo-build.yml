name: ASLAN Contabo Remote Build
# Re-trigger after operator corrected ASLAN_OPS_SSH_KEY secret
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aslan-contabo-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aslan-contabo-remote-build
  cancel-in-progress: false
jobs:
  remote-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OPS_HOST: ${{ secrets.ASLAN_OPS_HOST }}
          OPS_USER: ${{ secrets.ASLAN_OPS_USER }}
          OPS_KEY: ${{ secrets.ASLAN_OPS_SSH_KEY }}
          OPS_HOST_KEY: ${{ secrets.ASLAN_OPS_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPS_HOST" && test -n "$OPS_USER" && test -n "$OPS_KEY" && test -n "$OPS_HOST_KEY"
          umask 077
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import os, re, textwrap, pathlib, sys
          raw = os.environ['OPS_KEY'].strip().replace(chr(13), '')
          raw = raw.replace(chr(92) + 'n', chr(10))
          match = re.search('-----BEGIN OPENSSH PRIVATE KEY-----(.*?)-----END OPENSSH PRIVATE KEY-----', raw, re.S)
          if not match:
              print('KEY_FORMAT_ERROR: Missing key markers; no secret displayed')
              sys.exit(20)
          body = ''.join(match.group(1).split())
          if not re.fullmatch('[A-Za-z0-9+/=]+', body):
              print('KEY_FORMAT_ERROR: Invalid encoded body; no secret displayed')
              sys.exit(21)
          newline = chr(10)
          formatted = '-----BEGIN OPENSSH PRIVATE KEY-----' + newline + newline.join(textwrap.wrap(body, 70)) + newline + '-----END OPENSSH PRIVATE KEY-----' + newline
          pathlib.Path.home().joinpath('.ssh/id_ed25519').write_text(formatted)
          print('KEY_FORMAT_NORMALIZED')
          PY
          # Host key must be a public known_hosts entry, never a private key.
          if printf '%s' "$OPS_HOST_KEY" | grep -q -- 'PRIVATE KEY'; then
            echo 'HOST_KEY_FORMAT_ERROR: ASLAN_OPS_HOST_KEY contains private-key material'
            exit 23
          fi
          if ! printf '%s\n' "$OPS_HOST_KEY" | ssh-keygen -lf - >/dev/null 2>&1; then
            echo 'HOST_KEY_FORMAT_ERROR: expected an SSH public host-key entry'
            exit 24
          fi
          printf '%s\n' "$OPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 > /dev/null 2>/dev/null; then
            echo "KEY_VALIDATION_FAILED: Secret key data is incomplete or corrupted. No SSH attempted."
            exit 22
          fi
          echo "KEY_VALIDATION_PASS"
          echo "OPS_HOST=$OPS_HOST" >> "$GITHUB_ENV"
          echo "OPS_USER=$OPS_USER" >> "$GITHUB_ENV"
      - name: Transfer source to isolated Contabo workspace
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/aslan-source.tgz .
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$OPS_USER@$OPS_HOST" 'mkdir -p "$HOME/aslan-builds"'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/aslan-source.tgz "$OPS_USER@$OPS_HOST:aslan-builds/source.tgz"
      - name: Execute remote dependency installation and build
        env:
          ASLAN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$OPS_USER@$OPS_HOST" "ASLAN_SHA='$ASLAN_SHA' bash -se" <<'REMOTE' | tee /tmp/aslan-build-report.txt
          set -Eeuo pipefail
          workspace="$HOME/aslan-builds/$ASLAN_SHA"
          mkdir -p "$workspace"
          tar -xzf "$HOME/aslan-builds/source.tgz" -C "$workspace"
          cd "$workspace"
          echo "ASLAN remote workspace: $workspace"
          echo "User: $(id -un)"
          echo "Node: $(command -v node || echo missing)"
          echo "NPM: $(command -v npm || echo missing)"
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "BLOCKED: Node.js/npm missing on Contabo; source transferred successfully"
            exit 4
          fi
          node --version
          npm --version
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run build
          echo "ASLAN_REMOTE_BUILD_PASS"
          echo "Starting isolated localhost-only HTTP smoke test"
          PORT=3187 HOSTNAME=127.0.0.1 npm run start -- -p 3187 > "$workspace/staging-http.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "FAIL: Next.js staging process exited"
              tail -n 35 "$workspace/staging-http.log"
              exit 5
            fi
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://127.0.0.1:3187/ || true)
            if [[ "$status" =~ ^[23][0-9][0-9]$ ]]; then
              echo "ASLAN_STAGING_HTTP_PASS status=$status"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: staging HTTP did not return 2xx/3xx"
            tail -n 35 "$workspace/staging-http.log"
            exit 6
          fi
          REMOTE
          grep -Fxq 'ASLAN_REMOTE_BUILD_PASS' /tmp/aslan-build-report.txt
      - name: Report
        if: always()
        run: |
          {
            echo '## ASLAN Contabo remote build'
            echo 'Status: ${{ job.status }}'
            echo 'Target: isolated aslan-ops home workspace (not production)'
            echo 'Commit: ${{ github.sha }}'
            if [ -f /tmp/aslan-build-report.txt ]; then
              echo 'Remote build tail:'
              echo '~~~'
              tail -n 35 /tmp/aslan-build-report.txt
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
