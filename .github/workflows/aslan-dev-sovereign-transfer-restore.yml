
# TLS_GATE — normalize harmless whitespace, reject unsafe modes.
# A PGSSLMODE override does not supersede an explicit sslmode in the URI.

if [[ "$SUPABASE_DB_URL" =~ [\?\&]sslmode=([^\&]*) ]]; then
  sslmode="${BASH_REMATCH[1]}"

  # Remove whitespace around the value only.
  sslmode="$(printf '%s' "$sslmode" |
    sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

  case "$sslmode" in
    require|verify-ca|verify-full)
      export PGSSLMODE="$sslmode"
      echo "TLS_GATE: PASS (explicit safe mode)"
      ;;
    *)
      echo "TLS_GATE: FAIL (invalid explicit sslmode)"
      exit 1
      ;;
  esac
else
  export PGSSLMODE=require
  echo "TLS_GATE: PASS (enforced PGSSLMODE=require)"
fi
