name: ASLAN Dev Sovereign Direct Backup and Transfer
on:
  workflow_dispatch:
  push:
    branches:
      - fix/unified-v1-fixes
    paths:
      - .github/workflows/aslan-dev-sovereign-transfer-restore.yml
permissions:
  contents: read
concurrency:
  group: aslan-sovereign-transfer
  cancel-in-progress: false
jobs:
  sovereign:
    if: github.ref == 'refs/heads/fix/unified-v1-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout development scripts only
        uses: actions/checkout@v4
        with:
          ref: fix/unified-v1-fixes
          persist-credentials: false
      - name: Source inventory, verified backup and isolated restore
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPS_HOST: ${{ secrets.ASLAN_OPS_HOST }}
          OPS_USER: ${{ secrets.ASLAN_OPS_USER }}
          OPS_HOST_KEY: ${{ secrets.ASLAN_OPS_HOST_KEY }}
          OPS_KEY: ${{ secrets.ASLAN_OPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for name in SUPABASE_DB_URL OPS_HOST OPS_USER OPS_HOST_KEY OPS_KEY; do
            [[ -n "${!name:-}" ]] || { echo "FAIL: missing $name"; exit 1; }
          done
          bash -n scripts/ops/aslan-supabase-sovereign-backup.sh
          echo 'STAGE: direct database dump and verified transfer'
          bash scripts/ops/aslan-supabase-sovereign-backup.sh
          echo 'RESULT: BACKUP_TRANSFER_COMPLETE; ISOLATED_RESTORE_NOT_RUN'
