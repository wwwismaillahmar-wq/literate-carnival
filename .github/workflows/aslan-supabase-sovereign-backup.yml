name: ASLAN Supabase Sovereign Backup (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supabase-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify backup script syntax
        run: bash -n scripts/ops/aslan-supabase-sovereign-backup.sh
      - name: Back up Supabase and verify copy on Contabo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPS_HOST: ${{ secrets.ASLAN_OPS_HOST }}
          OPS_USER: ${{ secrets.ASLAN_OPS_USER }}
          OPS_HOST_KEY: ${{ secrets.ASLAN_OPS_HOST_KEY }}
          OPS_KEY: ${{ secrets.ASLAN_OPS_SSH_KEY }}
        run: bash scripts/ops/aslan-supabase-sovereign-backup.sh
