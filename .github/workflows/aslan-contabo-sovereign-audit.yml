name: ASLAN Contabo Sovereign Read-only Audit
on:
  workflow_dispatch:
  push:
    branches:
      - fix/unified-v1-fixes
    paths:
      - .github/workflows/aslan-contabo-sovereign-audit.yml
      - scripts/ops/aslan-supabase-sovereign-backup.sh
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify presence of database connection secret (never reveal value)
        env:
          DATABASE_URL_PRESENT: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          if [ "$DATABASE_URL_PRESENT" = true ]; then echo 'SUPABASE_DB_URL: CONFIGURED'; else echo 'SUPABASE_DB_URL: MISSING'; fi
      - name: Read-only PostgreSQL identity and TLS diagnostic
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_DB_URL:-}" ]] || { echo 'IDENTITY_GATE: FAIL (secret missing)'; exit 1; }
          if [[ "$SUPABASE_DB_URL" == *zyenfobyorjfwkdgeube* ]]; then
            echo 'IDENTITY_GATE: PASS'
          else
            echo 'IDENTITY_GATE: FAIL'
            exit 1
          fi
          export PGCONNECT_TIMEOUT=15
          if [[ "$SUPABASE_DB_URL" =~ [\?\&]sslmode=([^\&]+) ]]; then
            mode="${BASH_REMATCH[1]}"
            case "$mode" in
              require|verify-ca|verify-full) echo "TLS_GATE: PASS (explicit $mode)" ;;
              *) echo 'TLS_GATE: FAIL (unsafe URI sslmode)'; exit 1 ;;
            esac
          else
            export PGSSLMODE=require
            echo 'TLS_GATE: PASS (PGSSLMODE=require enforced)'
          fi
          if docker run --rm --network host -e SUPABASE_DB_URL -e PGSSLMODE -e PGCONNECT_TIMEOUT postgres:17 bash -c '
            set -euo pipefail
            result="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT current_database() || chr(124) || (SELECT ssl::text FROM pg_stat_ssl WHERE pid=pg_backend_pid())")"
            [[ "$result" == "postgres|true" ]]
          ' 2>/dev/null; then
            echo 'CONNECTION_GATE: PASS (postgres; pg_stat_ssl=true)'
          else
            echo 'CONNECTION_GATE: FAIL (database identity, routing, authentication, or TLS)'
            exit 1
          fi
      - name: Verify existing SSH channel and collect host inventory
        env:
          OPS_HOST: ${{ secrets.ASLAN_OPS_HOST }}
          OPS_USER: ${{ secrets.ASLAN_OPS_USER }}
          OPS_KEY: ${{ secrets.ASLAN_OPS_SSH_KEY }}
          OPS_HOST_KEY: ${{ secrets.ASLAN_OPS_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${OPS_HOST:?missing host}"
          : "${OPS_USER:?missing user}"
          : "${OPS_KEY:?missing SSH key}"
          : "${OPS_HOST_KEY:?missing known host key}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$OPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$OPS_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/id_ed25519 "$OPS_USER@$OPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo 'STAGE: host storage'
          df -h
          echo 'STAGE: memory'
          free -m
          echo 'STAGE: docker containers (names, image, state only)'
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo 'STAGE: docker volume names'
          docker volume ls --format '{{.Name}}'
          echo 'STAGE: container mounts (names and mount types; paths redacted)'
          docker ps -aq | while IFS= read -r id; do
            docker inspect --format '{{.Name}} {{range .Mounts}}{{.Type}}:{{.Name}} {{end}}' "$id"
          done
          REMOTE
